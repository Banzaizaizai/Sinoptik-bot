# ВНИМАНИЕ: schedule-триггер НАМЕРЕННО ОТКЛЮЧЁН (закомментирован) — не включать
# без явной необходимости.
#
# Боевой планировщик — собственная ВМ (cron), не этот workflow. Причина: мы
# считали, что sinoptik.ua стабильно блокирует IP GitHub-раннеров (Azure) —
# два ручных теста упали по ConnectTimeout. На деле блокировка НЕ стабильная:
# schedule-триггер был живым с 29.08 (включился сам при первом пуше файла) и
# 6 из 8 автозапусков УСПЕШНО прошли и продублировали отправку в канал —
# независимо от ВМ, из-за чего в канале несколько дней подряд были фантомные
# сообщения в "случайное" время (GitHub может запускать schedule с задержкой
# в часы при нагрузке — отсюда нестандартные тайминги). Обнаружено и отключено
# 2026-09-03. Если когда-нибудь снова включать schedule — сначала выключить
# cron на ВМ, чтобы не дублировать снова.
name: Weather forecast to Telegram

on:
  # schedule:
  #   - cron: "0 5 * * *"  # утро Kyiv -> прогноз на сегодня
  #   - cron: "0 10 * * *" # день Kyiv -> прогноз на сегодня
  #   - cron: "0 17 * * *" # вечер Kyiv -> прогноз на завтра
  workflow_dispatch:
    inputs:
      mode:
        description: "today — прогноз на сегодня, tomorrow — на завтра"
        type: choice
        options: [today, tomorrow]
        default: tomorrow

jobs:
  send-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then
            echo "value=tomorrow" >> "$GITHUB_OUTPUT"
          else
            echo "value=today" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          CITY_SLUG: drohobych
          CITY_NAME: "Дрогобич"
          TIMEZONE: Europe/Kyiv
        run: python run_bot.py --mode ${{ steps.mode.outputs.value }}
